[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-solutions-engineer-assessment"
version = "0.1.0"
description = "Task 1: strict MCP customer/refund STDIO assessment"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp==2.3.0", "pydantic==2.12.5"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.3"]

[project.scripts]
task1-mcp = "task1.__main__:main"

[tool.setuptools.packages.find]
include = ["task1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "task1: TASK-1 assessment verification",
    "wire: T1-004/T1-005 actual subprocess STDIO tests",
    "sdk_limitation: diagnostic for an unmet mandatory SDK wire requirement",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
