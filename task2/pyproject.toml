[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "assessment-task2-proxy"
version = "0.1.0"
description = "Task 2 secure FastAPI JSON-RPC proxy and HTTPX upstream adapter"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx==0.28.1", "fastapi==0.162.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3", "asgi-lifespan==2.1.0"]
serve = ["uvicorn==0.54.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["task2_proxy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
cache_dir = ".cache/pytest"
markers = [
    "task2: Task 2 guards, upstream adapter, ASGI and wire integration",
    "http_wire: T2-005 independent processes and real loopback TCP",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
