[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "assessment-task3-streaming"
version = "0.1.0"
description = "Task 3 pure bounded synthetic SSE parsing and PII redaction"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["task3_streaming*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
cache_dir = ".cache/pytest"
markers = ["task3: T3-002 pure approved synthetic SSE and redaction contract"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
